# Site settings
title: Matt Stiles
# Suffixed to the site title for the browser tab, search results and share
# cards. Keeps "data journalist" because people search that phrase, even though
# the on-page copy has moved past it.
tagline: "Data journalist and software builder"
domain: mattstiles.me
home: "I'm a journalist who"
# Cycled in the hero. Kept similar in length so the line doesn't jump, and
# phrased verb-plus-plural-noun so they stay parallel.
hats:
  - writes stories
  - leads teams
  - creates visuals
  - builds software
email: mattstiles@gmail.com
url: https://mattstiles.me
description: "Matt Stiles is a senior editor on CNN's visuals team who tells stories with data and builds open-source tools for reporting."
skills: "Two decades of data and visual storytelling in newsrooms. I also build open-source tools that help people find and make sense of data."
meta_author: Matt Stiles

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: myshortname

# Color settings (hex codes, no leading hash). These feed the CSS custom
# properties in _layouts/style.css, so a palette change is a one-file edit.
color:
  # Signal green sampled from the chart dots in Mound's own plots, so the site
  # and the graphics palette share a hue. Ink and greys follow moundcli.com.
  # Nudged a shade darker than Mound's #3D8162 so it clears AA on the warm
  # paper surfaces too, not just on white.
  primary: 3A7B5E
  primary-deep: 2E6149
  secondary: 101828
  secondary-dark: 0A0F1C

# Footer settings
footer:
  copyright: Matt Stiles
  location: Los Angeles

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: github
    url: http://github.com/stiles
  - title: twitter
    url: http://twitter.com/stiles
  - title: tiktok
    url: https://www.tiktok.com/@mattystiles
  - title: linkedin
    url: https://www.linkedin.com/in/matthustiles

# Postal address (add as many lines as necessary)
address:
  - line: mattstiles@gmail.com
  - line: Los Angeles, CA

# Credits content
credits: 'Made with Jekyll because WordPress is trash'

# Build settings
markdown: kramdown
permalink: pretty

# Repo housekeeping that shouldn't be served from the live site.
exclude:
  - PLANNING.md
  - README.md
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - LICENCE
  - freelancer-theme-jekyll.gemspec
  - img/raw
  - mail
  - vendor
  - .bundle

plugins:
  - jekyll-sitemap