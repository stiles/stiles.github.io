<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div>
        <span class="footer-name">{{ site.footer.copyright }}</span>
        <span class="footer-role">{{ site.footer.location }}</span>
      </div>
      <div class="footer-social">
        {% for network in site.social %}
        <a href="{{ network.url }}" aria-label="{{ network.title }}" rel="me">
          {% include icon.html name=network.title size=18 %}
        </a>
        {% endfor %}
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.footer.copyright }}</span>
      <span>{{ site.credits }}</span>
    </div>
  </div>
</footer>
