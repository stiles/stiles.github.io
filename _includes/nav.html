{%- assign home_prefix = '/' | relative_url -%}
{%- if page.url == '/' -%}
  {%- assign home_prefix = '' -%}
{%- endif -%}
<nav class="site-nav">
  <div class="container">
    <a class="nav-brand" href="{{ home_prefix }}#page-top">
      <img class="nav-avatar" src="{{ '/img/profile.png' | relative_url }}" alt="" width="30" height="30">
      <span>{{ site.title }}</span>
    </a>

    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="nav-links">
      <span class="visually-hidden">Menu</span>
      {% include icon.html name="menu" size=22 %}
    </button>

    <ul class="nav-links" id="nav-links">
      <li><a href="{{ home_prefix }}#portfolio">Projects</a></li>
      <li><a href="{{ home_prefix }}#about">About</a></li>
      <li><a href="{{ home_prefix }}#contact">Contact</a></li>
    </ul>
  </div>
</nav>
