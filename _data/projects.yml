# Work grid. Buckets render in the order set by _data/buckets.yml.
#
# Fields:
#   title       required
#   blurb       required, one sentence
#   bucket      required, must match a key in buckets.yml
#   img         optional, extensionless base name in img/portfolio/.
#               Cards without one render text-only.
#   w, h        required when img is set, so the markup can reserve space
#   alt         required when img is set
#   install     optional, shown as a mono install line
#   url         optional, the live thing
#   repo        optional, GitHub
#   writeup     optional, a post explaining how it works
#   note        optional, short status line shown on the card
#   featured    optional, true for the one lede card
#   terminal    optional, replaces the image with a code block (featured only)
#   caption     optional, explains the terminal block
#   tools       optional, list

# ---------------------------------------------------------------- featured
- title: Mound
  featured: true
  bucket: other-people-use
  install: pip install mound
  blurb: >-
    Retrieves, analyzes and visualizes MLB pitch-level data from the command line
    or a few lines of Python. Start from a player's name — no MLB IDs to look up,
    no undocumented APIs to learn.
  caption: >-
    One start, one table. The four-seamer lives in the zone and gets missed when
    hitters swing at it; the splitter's whole job is to be chased below it, and it
    was, 57.9% of the time.
  # TODO: confirm the date and opponent for game 825051 so the block reads as a
  # specific game rather than stale output.
  terminal_meta: "Roki Sasaki, game 825051"
  terminal: |
    $ mound arsenal "Roki Sasaki" --game 825051
                        pitches  usage%  strike%  whiff%  chase%  velo  spin    hb   ivb
    four-seam fastball       35    40.7     57.1    27.3     6.2  98.8  2427  11.2  16.9
    splitter                 32    37.2     81.2    13.6    57.9  90.2   868   5.3   1.0
    slider                   14    16.3     57.1    40.0    33.3  87.1  2099   3.0   0.1
    forkball                  5     5.8     60.0    50.0     0.0  88.2   758   2.8  -2.0
  url: https://www.moundcli.com
  repo: https://github.com/stiles/mound
  writeup: https://www.moundcli.com/examples/ohtani-spin-chase
  tools: [Python, CLI]

# ------------------------------------------------- things other people use
- title: ezesri
  bucket: other-people-use
  install: pip install ezesri
  blurb: >-
    Pulls data and metadata out of Esri REST endpoints — the format most government
    GIS portals publish in — and writes it to GeoJSON, Shapefile, GeoPackage or
    GeoParquet.
  img: ezesri
  w: 900
  h: 506
  alt: The ezesri web app, with a field for pasting an Esri REST layer URL
  url: https://www.ezesri.com
  repo: https://github.com/stiles/ezesri
  writeup: https://medium.com/@stiles/unlock-troves-of-mapping-data-with-ezesri-a-python-package-for-exploring-and-extracting-esri-0fec4c7df2fa
  tools: [Python]

- title: streetview-dl
  bucket: other-people-use
  install: pip install streetview-dl
  blurb: >-
    Finds and downloads full-resolution Google Street View panoramas from a URL or
    a pair of coordinates, including historical captures of the same spot.
  img: streetview-dl
  w: 900
  h: 506
  alt: Street View panorama of the Sixth Street Viaduct in Los Angeles
  repo: https://github.com/stiles/streetview-dl
  writeup: https://medium.com/@stiles/download-high-resolution-google-street-view-panoramas-in-the-command-line-a800ef16f270
