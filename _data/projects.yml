# Work grid. Buckets render in the order set by _data/buckets.yml.
#
# Fields:
#   title       required
#   blurb       required, one sentence
#   bucket      required, must match a key in buckets.yml
#   img         optional, extensionless base name in img/portfolio/.
#               Cards without one render text-only.
#   w, h        required when img is set, so the markup can reserve space
#   alt         required when img is set
#   install     optional, shown as a mono install line
#   url         optional, the live thing
#   repo        optional, GitHub
#   writeup     optional, a post explaining how it works
#   note        optional, short status line shown on the card
#   featured    optional, true for the one lede card
#   terminal    optional, replaces the image with a code block (featured only)
#   caption     optional, explains the terminal block
#
# Three tag axes, kept separate because they answer different questions. Cards
# show the first two; the stack only appears in the modal, where there's room.
#
#   does        required, what it produces. One or two of:
#                 Data extraction, Mapping, Data viz, Analysis, Reference
#               Deliberately no "automation" or "interactive" term -- the bucket
#               heading above the card already says that.
#   domain      optional, the subject. Aviation, Baseball and Los Angeles are
#               real clusters; the rest are one-offs that still tell a reader
#               what they're looking at. Omit for general-purpose tools.
#   built       required, the stack. Verified against each repo's manifest
#               rather than assumed, so keep it that way when editing.

# ---------------------------------------------------------------- featured
- title: Mound
  featured: true
  bucket: other-people-use
  install: pip install mound
  blurb: >-
    Retrieves, analyzes and visualizes MLB pitch-level data from the command line
    or a few lines of Python. Start from a player's name — no MLB IDs to look up,
    no undocumented APIs to learn.
  caption: >-
  # Session shown in the featured card. Rendered as a stepped, typed sequence
  # where JS and motion allow, and as a plain transcript everywhere else.
  # Output is verbatim from the installed CLI -- regenerate rather than hand-edit
  # if the numbers need refreshing, since the column alignment is load-bearing.
  terminal_meta: "mound — roki sasaki"
  # The "|2" is required, not stylistic: the arsenal header is indented deeper
  # than the rows beneath it, so YAML would infer the block's indentation from
  # that first line and read the rows as a dedent. The indicator pins it.
  terminal_steps:
    - cmd: mound search "roki sasaki"
      out: |2
        808963	Roki Sasaki	Pitcher	Los Angeles Dodgers
    - cmd: mound games "roki sasaki" --last 5
      out: |2
        Roki Sasaki · 5 game(s)
              date             opponent       game_pk
        2026-07-30     Seattle Mariners home   823921
        2026-08-07 Arizona Diamondbacks away   825051
        2026-08-13    Milwaukee Brewers home   823915
        2026-08-19     Colorado Rockies away   824318
        2026-08-26       Atlanta Braves away   824878
    - cmd: mound arsenal "roki sasaki" --game 823921
      out: |2
                            pitches  usage%  strike%  whiff%  chase%  velo  spin    hb   ivb
        splitter                 37    41.1     62.2    47.6    48.1  91.1   944   7.4   1.8
        four-seam fastball       33    36.7     69.7    23.1    26.7  99.1  2364  11.5  15.8
        slider                   20    22.2     75.0    30.0    37.5  86.8  2042   1.3  -1.9
  url: https://www.moundcli.com
  repo: https://github.com/stiles/mound
  writeup: https://www.moundcli.com/examples/ohtani-spin-chase
  does: [Data extraction, Analysis, Data viz]
  domain: Baseball
  built: [Python, CLI, matplotlib]

