  w: 900
  h: 506
  alt: A pyfr24 plot tracing a single flight path
  url: https://pyfr24.readthedocs.io
  repo: https://github.com/stiles/pyfr24
  writeup: https://medium.com/@stiles/from-flight-number-to-rich-data-using-pyfr24-for-aviation-analysis-10f8124f80f1
